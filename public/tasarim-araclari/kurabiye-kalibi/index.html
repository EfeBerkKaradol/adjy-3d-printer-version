<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yılbaşı Kurabiye Kalıbı — Kendi Şeklin</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../_adjy/three.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <!-- ADJY mağaza köprüsü: tema, müşteri/atölye kipi, durum kaydı -->
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../_adjy/yilbasi.css" />
  <link rel="stylesheet" href="../_adjy/kopru.css" />
  <script src="./adjy.js"></script>
  <script src="../_adjy/kopru.js"></script>
  <script src="../_adjy/olcu.js"></script>
  <script src="../_adjy/renkli.js"></script>
</head>
<body>
  <div class="yb-izgara">
    <!-- ================= AYARLAR ================= -->
    <aside class="yb-panel">
      <section class="yb-grup" id="grup-sekil">
        <h2 class="yb-baslik">Şekil</h2>
        <div class="param-row">
          <label class="yb-etiket" for="kk-sekil">Şekil</label>
          <select id="kk-sekil" class="yb-gizli-secim">
            <option value="yildiz" selected>Yıldız</option>
            <option value="agac">Çam</option>
            <option value="kardan">Kardan adam</option>
            <option value="can">Çan</option>
            <option value="kurabiye">Kurabiye adam</option>
            <option value="eldiven">Eldiven</option>
            <option value="baston">Şeker baston</option>
            <option value="kalp">Kalp</option>
            <option value="ev">Ev</option>
            <option value="kar">Kar tanesi</option>
          </select>
          <div class="yb-sekiller" data-secim="kk-sekil">
            <button type="button" data-v="yildiz"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l4 9.6 10.3.9-7.8 6.8 2.4 10.1L16 24l-8.9 5.4 2.4-10.1-7.8-6.8 10.3-.9z"/></svg>Yıldız</button>
            <button type="button" data-v="agac"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l7 9h-3l6 8h-3l6 8H3l6-8H6l6-8H9zM14 26h4v5h-4z"/></svg>Çam</button>
            <button type="button" data-v="kardan"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 9a8 8 0 1 1 0 16 8 8 0 0 1 0-16z"/></svg>Kardan adam</button>
            <button type="button" data-v="can"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4c5 0 7 4 7 9s2 7 6 10v2H3v-2c4-3 6-5 6-10s2-9 7-9zm0 21.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>Çan</button>
            <button type="button" data-v="kurabiye"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2a5 5 0 0 1 5 5c0 1.6-.8 3-2 4h7a3 3 0 0 1 0 6h-5l3 9a3 3 0 0 1-5.6 2L16 23l-2.4 5a3 3 0 0 1-5.6-2l3-9H6a3 3 0 0 1 0-6h7c-1.2-1-2-2.4-2-4a5 5 0 0 1 5-5z"/></svg>Kurabiye adam</button>
            <button type="button" data-v="eldiven"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 4h9a4 4 0 0 1 4 4v8l3-3a2.5 2.5 0 0 1 3.5 3.5L23 23v5H10V8a4 4 0 0 1 0-4z"/></svg>Eldiven</button>
            <button type="button" data-v="baston"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19 3a8 8 0 0 1 8 8v2h-5v-2a3 3 0 0 0-6 0v18h-5V11a8 8 0 0 1 8-8z"/></svg>Şeker baston</button>
            <button type="button" data-v="kalp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28S3 20 3 11.5C3 7 6 4 9.5 4 12.5 4 15 6 16 8.5 17 6 19.5 4 22.5 4 26 4 29 7 29 11.5 29 20 16 28 16 28z"/></svg>Kalp</button>
            <button type="button" data-v="ev"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l13 11h-3v15H6V14H3z"/></svg>Ev</button>
            <button type="button" data-v="kar"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15 2h2v28h-2zM3.9 8.5l1-1.7 23.2 13.4-1 1.7zM28.1 8.5l-1-1.7L3.9 20.2l1 1.7z"/></svg>Kar tanesi</button>
          </div>
        </div>
      </section>

      <section class="yb-grup" id="grup-olcu">
        <h2 class="yb-baslik">Ölçü</h2>
        <div class="param-row">
          <label class="yb-etiket" for="kk-boy">Kurabiye boyu</label>
          <div class="yb-kaydir"><input type="range" id="kk-boy" min="40" max="130" step="5" value="75" /><span class="num-wrap"><input type="number" data-bagli="kk-boy" min="40" max="130" step="5" value="75" aria-label="Kurabiye boyu" /><span class="unit">mm</span></span></div>
        </div>
        <div class="param-row">
          <label class="yb-etiket" for="kk-derin">Kesme derinliği</label>
          <div class="yb-kaydir"><input type="range" id="kk-derin" min="8" max="22" step="1" value="13" /><span class="num-wrap"><input type="number" data-bagli="kk-derin" min="8" max="22" step="1" value="13" aria-label="Kesme derinliği" /><span class="unit">mm</span></span></div>
        </div>
      </section>

      <section class="yb-grup" id="grup-ayrinti">
        <h2 class="yb-baslik">Ayrıntı</h2>
        <div class="param-row">
          <label class="yb-etiket" for="kk-kenar">Tutma kenarı</label>
          <div class="yb-kaydir"><input type="range" id="kk-kenar" min="2" max="8" step="0.5" value="4.5" /><span class="num-wrap"><input type="number" data-bagli="kk-kenar" min="2" max="8" step="0.5" value="4.5" aria-label="Tutma kenarı" /><span class="unit">mm</span></span></div>
        </div>
        <div class="param-row">
          <label class="yb-kutu"><input type="checkbox" id="kk-aski" /> <span>Asma deliği</span></label>
          <p class="yb-not">Kenara ip geçecek bir delik ekler.</p>
        </div>
      </section>

      <section class="yb-grup" id="grup-renk">
        <h2 class="yb-baslik">Renk</h2>
        <div class="param-row yb-renk-satir">
          <label class="yb-etiket" for="kk-renk">Renk</label>
          <select id="kk-renk" class="yb-gizli-secim">
            <option value="kirmizi" selected>Kırmızı</option>
            <option value="yesil">Çam yeşili</option>
            <option value="beyaz">Beyaz</option>
            <option value="altin">Altın</option>
            <option value="gumus">Gümüş</option>
            <option value="pembe">Pembe</option>
            <option value="mavi">Buz mavisi</option>
            <option value="siyah">Siyah</option>
          </select>
          <div class="yb-renkler" data-secim="kk-renk">
            <button type="button" data-v="kirmizi" style="--r:#c4202b" title="Kırmızı"></button>
            <button type="button" data-v="yesil" style="--r:#1f6b3a" title="Çam yeşili"></button>
            <button type="button" data-v="beyaz" style="--r:#f3f1ea" title="Beyaz"></button>
            <button type="button" data-v="altin" style="--r:#d2a347" title="Altın"></button>
            <button type="button" data-v="gumus" style="--r:#b9bcc2" title="Gümüş"></button>
            <button type="button" data-v="pembe" style="--r:#e58fb0" title="Pembe"></button>
            <button type="button" data-v="mavi" style="--r:#5d9bd8" title="Buz mavisi"></button>
            <button type="button" data-v="siyah" style="--r:#25262a" title="Siyah"></button>
          </div>
        </div>
      </section>
    </aside>

    <!-- ================= SAHNE ================= -->
    <section class="yb-sahne">
      <canvas id="kk-tuval" class="yb-tuval"></canvas>
      <div class="yb-sahne-ust">
        <span class="yb-olcu" id="kk-olcu">—</span>
        <span class="yb-uyari" id="kk-uyari" hidden></span>
      </div>
    </section>

    <!-- ================= ATÖLYE (müşteriye gizli) ================= -->
    <aside class="yb-atolye">
      <section class="yb-grup">
        <h2 class="yb-baslik">Üretim</h2>
        <dl class="yb-tablo" id="kk-tablo"></dl>
      </section>
      <section class="yb-grup">
        <h2 class="yb-baslik">Baskı ayarları</h2>
        <div class="param-row"><label class="yb-etiket" for="kk-bicak">Bıçak kalınlığı</label><span class="num-wrap"><input type="number" id="kk-bicak" min="0.8" max="1.8" step="0.1" value="1" /><span class="unit">mm</span></span></div>
        <div class="param-row"><label class="yb-etiket" for="kk-kenar-kal">Kenar kalınlığı</label><span class="num-wrap"><input type="number" id="kk-kenar-kal" min="1.2" max="3" step="0.2" value="2" /><span class="unit">mm</span></span></div>
        <div class="param-row"><label class="yb-etiket" for="kk-cozunurluk">Kontur çözünürlüğü</label><span class="num-wrap"><input type="number" id="kk-cozunurluk" min="6" max="16" step="1" value="10" /><span class="unit">px/mm</span></span></div>
      </section>
      <section class="yb-grup">
        <h2 class="yb-baslik">Çıktılar</h2>
        <button type="button" class="yb-cikti" id="kk-stl">Kalıp (STL)</button>
        <button type="button" class="yb-cikti yb-ikincil" id="kk-csv">Kalıp bilgisi (CSV)</button>
        <p class="yb-not">Z yukarı, mm. Tutma kenarı tablaya oturur, bıçak yukarı çıkar; desteksiz. Bıçağın son 3 mm'si incelir (keskin kenar). PLA; 100% dolgu, 3 perimetre.</p>
      </section>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
